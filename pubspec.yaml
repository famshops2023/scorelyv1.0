name: scorely
description: "Scorely - Live Cricket Scoring & Team Management"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  confetti: ^0.8.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.2
  go_router: ^17.4.0
  google_fonts: ^8.2.1
  intl: ^0.20.3
  drift: ^2.34.3
  sqlite3_flutter_libs: ^0.6.0+eol
  path: ^1.9.1
  path_provider: ^2.1.6
  pdf: ^3.13.0
  printing: ^5.15.0
  screenshot: ^3.0.0
  share_plus: ^13.3.0
  shared_preferences: ^2.5.5
  qr_flutter: ^4.1.0
  image_picker: ^1.2.3
  app_links: ^7.2.1
  http: ^1.6.0
  mobile_scanner: ^7.4.0
  uuid: ^4.6.0
  wakelock_plus: ^1.7.0
  audioplayers: ^6.8.1
  flutter_local_notifications: ^22.2.0
  google_sign_in: ^7.2.0
  connectivity_plus: ^7.3.1
  video_player: ^2.9.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.34.0
  build_runner: ^2.15.1
  postgres: ^3.5.12

flutter:
  uses-material-design: true
